name: Nightly Trigger

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 5 * * *'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write  # force-push the nightly branch
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Tag
      run: |
        git branch -D nightly || true
        git checkout -b nightly
        git push origin nightly --force

    - name: Invoke workflow
      env:
        GH_TOKEN: ${{ secrets.MACHINE_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: gh workflow run haskell.yml --ref nightly -f reason=nightly -f tests=all
