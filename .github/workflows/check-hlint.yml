name: Check HLint

on:
  pull_request: # Required for workflows to be able to be approved from forks
  merge_group:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # TODO: The rwe/actions-hlint-* actions are unmaintained and run on Node.js 12,
    # which GitHub forces onto a newer runtime with a deprecation warning.  Switch to
    # the maintained haskell-actions/hlint-setup and haskell-actions/hlint-run once
    # they have a release that runs on Node.js 24 (as of v2.4.10 they use Node.js 20).
    # See https://github.com/haskell-actions/hlint-setup/issues/216
    - name: 'Set up HLint'
      uses: rwe/actions-hlint-setup@9f5da5e7cd43663fb7b2e2154a087c17f0471ed1 # v1.0.3
      with:
        version: 3.8

    - name: 'Run HLint'
      uses: rwe/actions-hlint-run@c178fa6263930e604e377a21ef54403306bdc1c7 # v2.0.1
