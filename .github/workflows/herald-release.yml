# Triggered manually via the GitHub Actions UI or CLI:
#   gh workflow run herald-release.yml -f package=cardano-testnet
#   gh workflow run herald-release.yml -f package=cardano-testnet -f version=2.0.0.0
#
# What it does:
#   1. Batches changelog fragments into a new changelog section
#   2. Bumps the version (cabal file or version.txt, auto-computed or explicit)
#   3. Creates a release commit (tag is deferred to the manual signing step)
#   4. Adds a release changelog fragment for the next cycle
#   5. Pushes to a release/PACKAGE-VERSION branch
#   6. Opens a PR with signing instructions (and optionally CHaP submission commands)

name: Herald release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name to release (must match a project in .herald.yml)
        required: true
        type: choice
        options:
          - cardano-node-chairman
          - cardano-submit-api
          - cardano-testnet
      version:
        description: Explicit version (A.B.C or A.B.C.D). Leave empty to auto-compute.
        required: false
        type: string
      branch:
        description: Branch to release from and target for the PR. Leave empty to use the branch selected above.
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # herald-release interpolates these inputs into shell scripts, so reject
      # anything that is not a known package, a plain version number or a
      # branch name. Keep the package list in sync with the options above.
      - name: Validate inputs
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          case "$PACKAGE" in
            cardano-node-chairman|cardano-submit-api|cardano-testnet) ;;
            *)
              echo "::error::package must be one of the listed options"
              exit 1
              ;;
          esac
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::version must be empty or of the form A.B.C or A.B.C.D"
            exit 1
          fi
          if [ -n "$BRANCH" ] && { ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || ! git check-ref-format --branch "$BRANCH" > /dev/null; }; then
            echo "::error::branch must be empty or a valid branch name"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            extra-substituters = https://cache.iog.io/
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=

      - uses: input-output-hk/cardano-dev/actions/herald-release@b609066a050d9cdab63f1fe196dce4def0636aa7 # herald-release-0.0.3.1
        with:
          package: ${{ inputs.package }}
          version: ${{ inputs.version }}
          base-branch: ${{ inputs.branch || github.ref_name }}
