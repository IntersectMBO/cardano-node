name: "Haddock documentation"

on:
  # Allows testing this workflow on a branch before merging (the deploy step
  # below only runs for master).
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write  # deploy to the gh-pages branch
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Install Nix
      uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      with:
        # Use last stable nixos channel and the same nix as in channel:
        nix_path: nixpkgs=channel:nixos-24.05
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          experimental-features = nix-command flakes
          allow-import-from-derivation = true
          extra-substituters = https://cache.iog.io/
          extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # The `.#haddock` shell (see flake.nix) provides a GHC whose haddock does not
    # panic on `type data` declarations (GHC issue #25739): GHC 9.6.7's does.
    - uses: rrbutani/use-nix-shell-action@59a52b2b9bbfe3cc0e7deb8f9059abe37a439edf # v1.1.0
      with:
        devShell: .#haddock

    - name: Update cabal indices
      run: cabal update

    - name: Build whole project
      run: cabal build all

    - name: Build documentation
      run: cabal haddock-project --local --output=./haddocks --internal --foreign-libraries

    - name: Compress haddocks
      run: |
        tar -czf haddocks.tgz -C haddocks .

    - name: Upload haddocks artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      continue-on-error: true
      with:
        name: haddocks
        path: ./haddocks.tgz

    # cabal only prints a summary line when building docs for a dependency
    # fails; the actual haddock error is hidden in these logs.
    - name: Upload cabal logs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ failure() }}
      continue-on-error: true
      with:
        name: cabal-haddock-logs
        path: ~/.cache/cabal/logs/

    - name: Deploy documentation to gh-pages 🚀
      if: github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN || github.token }}
        publish_dir: haddocks
        cname: cardano-node.cardano.intersectmbo.org
        force_orphan: true
