pr: 6709
kind:
  - test
description: |
  Added two Dijkstra integration tests. `Hard fork to Dijkstra` starts a cluster in Conway at protocol version 10 and hard forks it through governance the way mainnet will: a `HardForkInitiation` action to PV 11.0, voted for by the default DReps and SPO and enacted, followed by a chained `HardForkInitiation` action to PV 12.0, then asserts that the node reports the Dijkstra era. `Nested transaction swap` additionally mints a native token in Conway and, once in Dijkstra, settles a multi-asset swap with a nested transaction: two independently signed sub-transactions (100 TokenA for 50 ADA) embedded in a top-level transaction signed only by the batcher, checked by reading the resulting UTxO set back from the node. It needs a `cardano-cli` with the `dijkstra transaction sub-transaction` commands (`CARDANO_CLI`). The generated node configuration now sets `ExperimentalHardForksEnabled: true` for every era, since without it the node declares PV11 as its maximum and rejects its own blocks with `ObsoleteNode` once the ledger reaches PV12.
