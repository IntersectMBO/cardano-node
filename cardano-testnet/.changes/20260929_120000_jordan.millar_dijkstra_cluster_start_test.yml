kind:
  - test
description: "Added Dijkstra integration properties covering governance-driven hard forks from Conway through protocol versions 11 and 12, a nested transaction token swap, sub-transaction guards, minting and spending, staking, and governance. Native and Plutus V4 script cases exercise direct and reference witnesses. Top-level guard properties cover key, native and Plutus V4 requirements, including missing-guard rejection and recovery. Separate top-level V4 minting and spending properties exercise direct and reference witnesses without guards or sub-transactions. Independent required top-level V4 guard properties cover spending, minting, certifying, rewarding, proposing and voting sub-transactions; a missing-datum control checks for ledger rejection rather than acceptance. The generated node configuration enables experimental hard forks so nodes can forge after reaching protocol version 12. The tests use cardano-cli 11.6 from the node 11.2 candidate for the `dijkstra sub-transaction` commands."
