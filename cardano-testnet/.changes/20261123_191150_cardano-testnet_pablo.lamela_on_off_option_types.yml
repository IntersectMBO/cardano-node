description: The `runtimeEnableNewEpochStateLogging` and `runtimeEnableChainStallWatchdog` options take `NewEpochStateLogging` and `ChainStallWatchdog` instead of `Bool`; use `NewEpochStateLoggingEnabled`/`NewEpochStateLoggingDisabled` and `ChainStallWatchdogEnabled`/`ChainStallWatchdogDisabled` instead of `True`/`False`.
