description: |
  Added `hprop_sighup_removed_kes_key_disables_forging`: starts a testnet whose SPO reads its KES key from a file, removes the key file, sends `SIGHUP` and checks that the node reports `DisabledBlockForging` and stops producing blocks. Added `Testnet.Signal.reloadNodeConfiguration` (sends `SIGHUP` to a node process).
